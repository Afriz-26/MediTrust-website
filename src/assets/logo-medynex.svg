<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Teal Gradients -->
    <linearGradient id="medynexCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="medynexHands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Group: Stethoscope Heart Outline -->
  <g fill="none" stroke="url(#medynexCyan)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart curves of stethoscope -->
    <path d="M 220 180 C 220 90, 140 70, 150 140 C 160 210, 240 270, 250 280 C 260 270, 340 210, 350 140 C 360 70, 280 90, 280 180" />
    <!-- Stethoscope earpieces/tubing tips -->
    <circle cx="218" cy="80" r="10" fill="#22D3EE" stroke="none" />
    <circle cx="282" cy="80" r="10" fill="#22D3EE" stroke="none" />
    <!-- Chest piece / Y-connector -->
    <path d="M 250 280 L 250 315" stroke-width="16" />
  </g>

  <!-- Medical Cross in Center -->
  <g fill="#0284C7">
    <!-- Vertical bar -->
    <rect x="232" y="105" width="36" height="100" rx="6" />
    <!-- Horizontal bar -->
    <rect x="200" y="137" width="100" height="36" rx="6" />
  </g>

  <!-- ECG Heartbeat line across the cross -->
  <path d="M 195 155 L 225 155 L 235 125 L 245 180 L 255 135 L 265 165 L 275 155 L 305 155" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cupping Hands at Bottom (Left & Right Wings) -->
  <!-- Left Hand -->
  <path d="M 245 350 C 190 345, 145 280, 115 205 C 125 240, 140 280, 160 305 C 130 250, 135 220, 130 215 C 145 260, 170 310, 205 340 C 165 270, 155 240, 150 230 C 175 280, 210 335, 245 350 Z" 
        fill="url(#medynexHands)" opacity="0.95" />
  
  <!-- Right Hand -->
  <path d="M 255 350 C 310 345, 355 280, 385 205 C 375 240, 360 280, 340 305 C 370 250, 365 220, 370 215 C 355 260, 330 310, 295 340 C 335 270, 345 240, 350 230 C 325 280, 290 335, 255 350 Z" 
        fill="url(#medynexHands)" opacity="0.95" />
</svg>
