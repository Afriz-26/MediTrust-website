<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medynexFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="medynexHandsFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
  </defs>

  <!-- Stethoscope Heart Outline -->
  <g fill="none" stroke="url(#medynexFaviconGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 220 180 C 220 90, 140 70, 150 140 C 160 210, 240 270, 250 280 C 260 270, 340 210, 350 140 C 360 70, 280 90, 280 180" />
    <circle cx="218" cy="80" r="14" fill="#22D3EE" stroke="none" />
    <circle cx="282" cy="80" r="14" fill="#22D3EE" stroke="none" />
    <path d="M 250 280 L 250 320" stroke-width="20" />
  </g>

  <!-- Medical Cross in Center -->
  <g fill="#0284C7">
    <rect x="230" y="105" width="40" height="100" rx="8" />
    <rect x="200" y="135" width="100" height="40" rx="8" />
  </g>

  <!-- ECG Heartbeat line -->
  <path d="M 195 155 L 225 155 L 235 125 L 245 180 L 255 135 L 265 165 L 275 155 L 305 155" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cupping Hands -->
  <path d="M 245 350 C 190 345, 145 280, 115 205 C 125 240, 140 280, 160 305 C 130 250, 135 220, 130 215 C 145 260, 170 310, 205 340 C 165 270, 155 240, 150 230 C 175 280, 210 335, 245 350 Z" 
        fill="url(#medynexHandsFavicon)" />
  <path d="M 255 350 C 310 345, 355 280, 385 205 C 375 240, 360 280, 340 305 C 370 250, 365 220, 370 215 C 355 260, 330 310, 295 340 C 335 270, 345 240, 350 230 C 325 280, 290 335, 255 350 Z" 
        fill="url(#medynexHandsFavicon)" />
</svg>
